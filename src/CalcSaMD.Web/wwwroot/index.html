<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CalcSaMD</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <!-- This placeholder is replaced by App.razor the instant the .NET
             WebAssembly runtime finishes downloading and starting up in the
             browser. If you ever load a page and see only this "Loading..."
             text and nothing else, the WASM runtime failed to start —
             open the browser console (F12) to see why. -->
        <div class="loading-indicator">Loading CalcSaMD…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
